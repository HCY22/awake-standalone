name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            rid: win-x64
            test: true
          - arch: ARM64
            rid: win-arm64
            test: false
    steps:
      - uses: actions/checkout@v5

      - name: Configure
        run: cmake -S . -B build -A ${{ matrix.arch }} -DAWAKE_BUILD_TESTS=${{ matrix.test && 'ON' || 'OFF' }}

      - name: Build
        run: cmake --build build --config MinSizeRel

      - name: Unit tests
        if: matrix.test
        run: build/MinSizeRel/awake_tests.exe

      - name: Smoke tests
        if: matrix.test
        shell: pwsh
        run: ./tests/smoke.ps1 -Exe build/MinSizeRel/Awake.exe

      - name: Package
        shell: pwsh
        run: |
          $dir = "dist/Awake-${{ matrix.rid }}"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item build/MinSizeRel/Awake.exe, scripts/install.ps1, scripts/uninstall.ps1, LICENSE $dir
          (Get-Item "$dir/Awake.exe").Length | ForEach-Object { "Awake.exe size: $_ bytes" }
          Compress-Archive -Path "$dir/*" -DestinationPath "Awake-${{ matrix.rid }}.zip"

      # Upload the folder, not the zip: GitHub already zips artifacts on download.
      - uses: actions/upload-artifact@v5
        with:
          name: Awake-${{ matrix.rid }}
          path: dist/Awake-${{ matrix.rid }}/

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Awake-${{ matrix.rid }}.zip
