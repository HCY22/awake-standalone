name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        rid: [win-x64, win-arm64]
        flavor: [framework-dependent, self-contained]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        shell: pwsh
        run: |
          $sc = '${{ matrix.flavor }}' -eq 'self-contained'
          ./scripts/build.ps1 -Runtime ${{ matrix.rid }} -SelfContained:$sc
          Copy-Item scripts/install.ps1, scripts/uninstall.ps1 dist/${{ matrix.rid }}/
          Compress-Archive -Path dist/${{ matrix.rid }}/* -DestinationPath Awake-${{ matrix.rid }}-${{ matrix.flavor }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Awake-${{ matrix.rid }}-${{ matrix.flavor }}
          path: Awake-${{ matrix.rid }}-${{ matrix.flavor }}.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Awake-${{ matrix.rid }}-${{ matrix.flavor }}.zip
